name: "Build protocol"
run-name: |-
  ${{ inputs.network-group }} / ${{ inputs.network }} / ${{ inputs.protocol }} / ${{ inputs.ref }}

defaults:
  run:
    shell: "sh"

on:
  workflow_dispatch:
    inputs:
      network-group:
        description: "Network's group"
        type: "choice"
        options:
          - "dev"
          - "main"
          - "test"
        required: true
      network:
        description: "Network's name"
        type: "string"
        required: true
      protocol:
        description: "Protocol"
        type: "string"
        required: true
      ref:
        description: "Smart contracts reference against which to build."
        type: "string"
        required: true

jobs:
  build:
    env:
      build_variant: |-
        ${{ ((inputs.network-group == 'dev' || inputs.network-group == 'test') && '-debug-assert') || '' }}
      host_network: |-
        ${{ inputs.network }}
      protocol_name: |-
        ${{ inputs.protocol }}
      protocols_dir: |-
        ${{ inputs.network-group }}net/${{ inputs.network }}/protocols/
      topology_dir: |-
        ${{ inputs.network-group }}net/${{ inputs.network }}/
    name: "Nix flake-based build"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          sparse-checkout: |-
            ./
            ${{ env.protocols_dir }}
            ${{ env.topology_dir }}
      - uses: "actions/checkout@v7"
        with:
          path: "contracts"
          ref: |-
            ${{ inputs.ref }}
          repository: "nolus-protocol/nolus-money-market"
          token: ${{ secrets.MONEY_MARKET_READ_TOKEN }}
      - name: "Setup Nix"
        uses: "cachix/install-nix-action@v31"
      - name: "Generate protocol information file"
        run: |-
          set -eu

          exec nix run \
            --inputs-from './contracts' \
            'nixpkgs#jaq' \
            -- \
            --arg 'hostNetwork' "$host_network" \
            --arg 'protocolName' "$protocol_name" \
            -c \
            -n \
            '{ hostNetwork: $hostNetwork, protocolName: $protocolName }' \
            >'protocol-info.json'
      - name: "Build derivation"
        run: |-
          set -eu

          exec nix build \
            --no-link \
            --override-input 'protocol-definition' "path:${protocols_dir}/${protocol_name}.json" \
            --override-input 'protocol-information' "path:protocol-info.json" \
            --override-input 'topology-definition' "path:${topology_dir}/topology.json" \
            --out-link 'packaged' \
            --print-out-paths \
            "./contracts#protocol$build_variant-packaged"
      - uses: "actions/upload-artifact@v7"
        with:
          if-no-files-found: "error"
          name: |-
            ${{ inputs.network-group }}--${{ inputs.network }}--${{ inputs.protocol }}
          path: |-
            packaged/*
